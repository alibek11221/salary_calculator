host: localhost:8080
info:
  contact: {}
  description: API для расчета зарплаты, управления бонусами и изменениями оклада.
  title: Salary Calculator API
  version: "1.0"
paths:
  /bonuses/:
    delete:
      consumes:
      - application/json
      description: Удаляет запись о бонусе
      parameters:
      - description: ID бонуса
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_delete_bonus.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_delete_bonus.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить бонус
      tags:
      - bonuses
    get:
      description: Возвращает список всех зарегистрированных бонусов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_list_bonuses.Out'
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список бонусов
      tags:
      - bonuses
    post:
      consumes:
      - application/json
      description: Создает новую запись о бонусе
      parameters:
      - description: Данные бонуса
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_add_bonus.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_add_bonus.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить бонус
      tags:
      - bonuses
    put:
      consumes:
      - application/json
      description: Обновляет данные существующего бонуса
      parameters:
      - description: Данные бонуса
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_edit_bonus.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_edit_bonus.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Редактировать бонус
      tags:
      - bonuses
  /duties/:
    delete:
      consumes:
      - application/json
      description: Удаляет запись о дежурстве
      parameters:
      - description: ID дежурства
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_delete_duty.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_delete_duty.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить дежурство
      tags:
      - duties
    get:
      description: Возвращает список всех зарегистрированных дежурств
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_list_duties.Out'
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список дежурств
      tags:
      - duties
    post:
      consumes:
      - application/json
      description: Создает новую запись о дежурстве
      parameters:
      - description: Данные дежурства
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_add_duty.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_add_duty.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить дежурство
      tags:
      - duties
    put:
      consumes:
      - application/json
      description: Обновляет данные существующего дежурства
      parameters:
      - description: Данные дежурства
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_edit_duty.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_edit_duty.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Редактировать дежурство
      tags:
      - duties
  /health/health:
    get:
      description: Возвращает текущее состояние сервиса и системные метрики
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers_health.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_http_handlers_health.Response'
      summary: Проверка здоровья
      tags:
      - health
  /salary/changes/:
    delete:
      consumes:
      - application/json
      description: Удаляет запись об изменении оклада
      parameters:
      - description: ID записи
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_delete_salary_change.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_delete_salary_change.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить изменение зарплаты
      tags:
      - salary
    get:
      description: Возвращает историю изменений базовой зарплаты
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_list_salary_changes.Out'
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список изменений зарплаты
      tags:
      - salary
    post:
      consumes:
      - application/json
      description: Создает новую запись об изменении оклада
      parameters:
      - description: Данные изменения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_add_salary_change.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_add_salary_change.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить изменение зарплаты
      tags:
      - salary
    put:
      consumes:
      - application/json
      description: Обновляет данные существующей записи об изменении оклада
      parameters:
      - description: Данные изменения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_edit_salary_change.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_edit_salary_change.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Редактировать изменение зарплаты
      tags:
      - salary
  /salary/report:
    get:
      description: Рассчитывает зарплату за указанный месяц и год
      parameters:
      - description: Год (напр. 2024)
        in: query
        name: year
        required: true
        type: integer
      - description: Месяц (1-12)
        in: query
        name: month
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_get_salary_report.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Отчет по зарплате
      tags:
      - salary
  /vacations/:
    delete:
      consumes:
      - application/json
      description: Удаляет период отпуска по id
      parameters:
      - description: ID отпуска
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_delete_vacation.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_delete_vacation.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить отпуск
      tags:
      - vacations
    get:
      description: Возвращает все периоды отпусков
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_list_vacations.Out'
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список отпусков
      tags:
      - vacations
    post:
      consumes:
      - application/json
      description: Создает период отпуска. Пересекающиеся периоды запрещены.
      parameters:
      - description: Период отпуска (даты в формате YYYY-MM-DD)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_add_vacation.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_add_vacation.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить отпуск
      tags:
      - vacations
    put:
      consumes:
      - application/json
      description: Обновляет период отпуска по id
      parameters:
      - description: Отпуск (id + даты YYYY-MM-DD)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/salary_calculator_internal_dto_edit_vacation.In'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/salary_calculator_internal_dto_edit_vacation.Out'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Изменить отпуск
      tags:
      - vacations
  /vacations/estimate:
    get:
      description: Считает отпускные и зарплату затронутых месяцев для гипотетического
        отпуска, ничего не сохраняя
      parameters:
      - description: Начало отпуска (YYYY-MM-DD)
        in: query
        name: from
